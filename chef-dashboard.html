<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chef Dashboard - Thanksgiving 2026</title>
<style>
:root {
  --bg: #0d1117; --panel: #161c25; --panel2: #1d2531; --ink: #eef2f7; --mute: #8e9bad;
  --accent: #ffb020; --ok: #3ecf8e; --bad: #ff5d5d; --cold: #5aa9ff; --hot: #ff8a3d; --line: #263140; --fit: 1;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
#app { display: grid; grid-template-rows: 11vh 6vh minmax(0, 1fr) 13vh; height: 100vh; gap: 1vh; padding: 1vh 1.2vw; }

/* header */
header { display: grid; grid-template-columns: minmax(0, 0.9fr) auto minmax(0, 2.4fr); align-items: center; gap: 1vw; min-height: 0; overflow: hidden; }
.brand { align-self: start; white-space: nowrap; line-height: 1.25; font-size: clamp(11px, min(1.1vw, 1.8vh), 22px); color: var(--mute); letter-spacing: 0.04em; text-transform: uppercase; }
.brand b { color: var(--accent); }
.clockbox { text-align: center; }
#clock { font-size: clamp(26px, min(4.6vw, 7.5vh), 88px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
#day { font-size: clamp(11px, min(1.2vw, 1.8vh), 22px); color: var(--mute); margin-top: 0.3vh; }
#modeBadge { display: inline-block; font-size: clamp(11px, 1vw, 18px); font-weight: 700; padding: 0.15em 0.6em; border-radius: 999px; margin-left: 0.6em; vertical-align: middle; }
.live { background: var(--ok); color: #05281a; } .sim { background: var(--accent); color: #2c1c00; }
.controls { display: flex; flex-wrap: wrap; gap: 0.5vw; justify-content: flex-end; align-items: center; }
button, select, input[type=time] { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  font-size: clamp(11px, 0.9vw, 17px); padding: 0.35em 0.65em; cursor: pointer; font-family: inherit; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #2c1c00; font-weight: 700; border-color: var(--accent); }
button.ok { background: var(--ok); color: #05281a; font-weight: 700; border-color: var(--ok); }

/* slider */
.sliderrow { position: relative; padding: 0 0.4vw; min-height: 0; overflow: hidden; }
#ticks { position: relative; height: 1.4vh; }
#ticks i { position: absolute; top: 0; width: 2px; height: 100%; background: #3a4a60; }
#ticks i.done { background: var(--ok); }
#slider { width: 100%; margin: 0; accent-color: var(--accent); height: 2.2vh; }
.sliderlabels { position: relative; height: 1.5em; font-size: clamp(10px, min(0.85vw, 1.6vh), 15px); color: var(--mute); }
.sliderlabels span { position: absolute; top: 0; white-space: nowrap; }

/* main */
main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr) minmax(0, 1fr); gap: 1vw; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 1vh; min-height: 0; }
.card { overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.2vh 1.1vw; min-height: 0; overflow: hidden; }
.card h3 { margin: 0 0 0.8vh; font-size: clamp(11px, 0.95vw, 17px); letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
#nowCard { flex: 2.4 1 0; display: flex; flex-direction: column; border-color: var(--accent); min-height: 0; overflow: hidden; }
#nowTitle { flex: 0 0 auto; }
#nowTitle { font-size: calc(clamp(22px, 3.4vw, 66px) * var(--fit)); font-weight: 800; line-height: 1.05; margin: 0.4vh 0 0.6vh; }
#nowAlso { font-size: clamp(12px, 1.25vw, 24px); color: var(--cold); margin-bottom: 0.8vh; flex: 0 0 auto; font-weight: 600; }
#nowAlso:empty { display: none; }
#nowMeta { font-size: clamp(12px, 1.2vw, 22px); color: var(--accent); margin-bottom: 1vh; flex: 0 0 auto; }
#nowDetail { font-size: calc(clamp(13px, 1.6vw, 30px) * var(--fit)); line-height: 1.3; color: #d6deea; overflow: hidden; flex: 1 1 auto; min-height: 0; }
#timerWrap { flex: 0 0 auto; padding-top: 1vh; }
#timer { text-align: left; font-size: clamp(30px, min(4.8vw, 11vh), 100px); font-weight: 800; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
#timer.over { color: var(--bad); }
#timerLabel { font-size: clamp(12px, 1.1vw, 20px); color: var(--mute); }
.bar { height: 1.4vh; background: #232d3b; border-radius: 999px; overflow: hidden; margin: 1vh 0; }
.bar > div { height: 100%; background: var(--accent); width: 0; }
.timerrow { display: flex; align-items: center; justify-content: space-between; gap: 1.2vw; }
.timerleft { min-width: 0; }
#doneBtn { font-size: clamp(11px, min(1.05vw, 1.9vh), 19px); padding: 0.5em 0.9em; flex: 0 1 22%; line-height: 1.15; align-self: center; max-height: 100%; }
#alsoCard { flex: 1 1 0; }
.row { display: flex; justify-content: space-between; gap: 0.8vw; font-size: clamp(12px, 1.1vw, 20px); padding: 0.35vh 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .t { color: var(--ink); } .row .r { color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row.late .t, .row.late .r { color: var(--bad); }
.row.donerow .t, .row.donerow .r { color: var(--ok); opacity: 0.75; }
.inner { transform-origin: top left; }
#viewNote { font-size: clamp(11px, min(1vw, 1.6vh), 18px); color: var(--cold); min-height: 1.1em; }
.viewer #doneBtn, .viewer #undoBtn, .viewer #mDone { display: none; }
#liveNote { font-size: clamp(11px, min(1.1vw, 1.7vh), 20px); color: var(--accent); margin-top: 0.3vh; min-height: 1.2em; font-variant-numeric: tabular-nums; }
.empty { color: var(--mute); font-size: clamp(12px, 1.05vw, 19px); }

/* ovens */
.oven { flex: 1 1 0; }
.oven .top { display: flex; justify-content: space-between; align-items: baseline; }
.oven .name { font-size: clamp(13px, 1.2vw, 22px); font-weight: 700; }
.oven .temp { font-size: clamp(22px, 2.6vw, 50px); font-weight: 800; font-variant-numeric: tabular-nums; }
.oven .what { font-size: clamp(13px, 1.3vw, 25px); line-height: 1.25; }
.oven .state { font-size: clamp(11px, 0.95vw, 17px); color: var(--mute); }
.oven.on { border-color: var(--hot); } .oven.on .temp { color: var(--hot); }
.oven.off .temp { color: var(--mute); }
.mini { font-size: clamp(11px, 0.95vw, 17px); color: var(--mute); }
#burnCard { flex: 1.2 1 0; }
.burnwrap { display: flex; gap: 1.2vw; align-items: center; }
.stove { display: flex; flex-direction: column; gap: 0.6vh; flex: 0 0 auto; }
.stove .rowb { display: flex; justify-content: center; gap: 0.5vw; }
.bc { border-radius: 50%; border: 2px solid #3a475a; color: #5d6b80; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #1d2531; }
.bc.small { width: clamp(24px, 2.3vw, 44px); height: clamp(24px, 2.3vw, 44px); font-size: clamp(11px, 1.1vw, 20px); }
.bc.large { width: clamp(32px, 3.1vw, 58px); height: clamp(32px, 3.1vw, 58px); font-size: clamp(13px, 1.4vw, 26px); }
.bc.on { color: #0d1117; border-color: transparent; }
.blist { flex: 1 1 auto; min-width: 0; }
.blist .brow { display: flex; align-items: baseline; gap: 0.6vw; font-size: clamp(11px, 1vw, 19px); padding: 0.3vh 0; border-bottom: 1px solid var(--line); }
.blist .brow:last-child { border-bottom: 0; }
.blist .brow i { font-style: normal; font-weight: 800; border-radius: 50%; width: 1.5em; height: 1.5em; display: inline-flex; align-items: center; justify-content: center; color: #0d1117; flex: 0 0 auto; }
.blist .brow .what { flex: 1 1 auto; font-size: inherit; line-height: 1.15; }
.blist .brow .what small { color: var(--mute); }
.blist .brow .tm { color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dots { display: flex; gap: 0.4vw; margin-bottom: 0.6vh; }
.dots span { width: 1.6vw; height: 1.6vw; max-width: 28px; max-height: 28px; border-radius: 50%; background: #2a3444; border: 2px solid #3a475a; }
.dots span.on { background: var(--hot); border-color: var(--hot); }

/* prepared */
#prepCard { flex: 1 1 0; }
#prepList.two { column-count: 2; column-gap: 1vw; }
#prepList.two .item { break-inside: avoid; }
#prepList { overflow: hidden; }
.item { display: flex; justify-content: space-between; gap: 0.6vw; font-size: clamp(11px, 1vw, 19px); padding: 0.45vh 0; border-bottom: 1px solid var(--line); line-height: 1.2; }
.item:last-child { border-bottom: 0; }
.chip { font-size: clamp(10px, 0.85vw, 15px); padding: 0.1em 0.55em; border-radius: 999px; background: #2a3444; color: #cfd8e6; text-align: right; max-width: 55%; }
.chip.fridge { background: #17324f; color: #9fcbff; } .chip.oven { background: #4a2a12; color: #ffc08a; }
.chip.cooler { background: #12404a; color: #8be3f2; } .chip.stove { background: #4a1d1d; color: #ffa8a8; }
.chip.table { background: #12412e; color: #8ff0c2; } .chip.counter { background: #2f3441; color: #cfd8e6; }

/* footer */
footer { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 2fr); gap: 1vw; min-height: 0; overflow: hidden; }
#nextCard { border-color: #3b4a60; }
#nextTitle { font-size: clamp(14px, min(1.5vw, 2.5vh), 28px); font-weight: 700; line-height: 1.1; }
#nextWhen { font-size: clamp(11px, min(1.05vw, 1.9vh), 20px); color: var(--cold); margin-top: 0.4vh; font-variant-numeric: tabular-nums; }
#upcoming .row { font-size: clamp(11px, min(1vw, 1.8vh), 18px); padding: 0.2vh 0; }
.keys { font-size: clamp(10px, 0.85vw, 15px); color: var(--mute); margin-top: 0.6vh; }
kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.4em; font-family: inherit; }

#updateBar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 20; background: var(--accent); color: #2c1c00; padding: 0.5em 1em; border-radius: 999px; font-weight: 700; font-size: clamp(12px, 1.1vw, 18px); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
#updateBar[hidden] { display: none; }
#updateBar button { margin-left: 0.6em; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 10; }
#modal[hidden] { display: none; }
#modal .box { background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 2vh 2vw; width: min(720px, 92vw); max-height: 86vh; overflow: auto; }
#modal h2 { margin: 0 0 1.2vh; font-size: clamp(16px, 1.6vw, 28px); }
#modal table { width: 100%; border-collapse: collapse; font-size: clamp(13px, 1.1vw, 20px); }
#modal td { padding: 0.5vh 0.4vw; border-bottom: 1px solid var(--line); vertical-align: middle; }
#modal td.k { white-space: nowrap; color: var(--accent); }
#modal .actions { margin-top: 1.4vh; display: flex; gap: 0.8vw; justify-content: flex-end; }
#mbar { display: none; }
@media (max-width: 900px) {
  html, body { overflow: auto; -webkit-text-size-adjust: 100%; }
  #app { display: flex; flex-direction: column; height: auto; min-height: 100vh; gap: 10px; padding: 8px 10px 84px; }
  header { order: 0; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0 4px; grid-template-columns: 1fr auto; overflow: visible; }
  .brand { font-size: 11px; }
  .clockbox { text-align: right; }
  #clock { font-size: 34px; }
  #day { font-size: 12px; }
  #modeBadge { font-size: 10px; }
  #liveNote { font-size: 12px; }
  .controls { display: none; }
  .sliderrow { order: 1; }
  main, footer, .col { display: contents; }
  .card { flex: none !important; min-height: 0; overflow: visible; padding: 12px; border-radius: 12px; }
  #nowCard { order: 2; } #nextCard { order: 3; } #alsoCard { order: 4; } #ovenTop { order: 5; } #ovenBottom { order: 6; }
  #burnCard { order: 7; } #upCard { order: 8; } #prepCard { order: 9; }
  .card h3 { font-size: 12px; }
  #nowTitle { font-size: 28px !important; }
  #nowMeta { font-size: 14px; }
  #nowDetail { font-size: 17px !important; flex: none; overflow: visible; }
  #timer { font-size: 54px !important; }
  #timerLabel { font-size: 12px; }
  #doneBtn { font-size: 14px; padding: 0.6em 0.9em; flex: 0 1 34%; }
  .bar { height: 10px; }
  .row { font-size: 15px; }
  .oven .name { font-size: 15px; } .oven .temp { font-size: 30px; } .oven .what { font-size: 16px; } .oven .state { font-size: 13px; }
  #nextTitle { font-size: 20px; } #nextWhen { font-size: 15px; }
  #upcoming .row { font-size: 14px; }
  .blist .brow { font-size: 14px; }
  .bc.small { width: 34px; height: 34px; font-size: 14px; } .bc.large { width: 44px; height: 44px; font-size: 18px; }
  .item { font-size: 14px; } .chip { font-size: 12px; }
  .keys { display: none; }
  #mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #0b0f14; border-top: 1px solid var(--line); }
  #mbar button { flex: 1; font-size: 18px; padding: 0.8em 0; }
  #mbar #mDone { flex: 2; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b id="appName">Chef Dashboard</b><br>Thanksgiving 2026<br>Dinner 5:30 PM</div>
    <div class="clockbox">
      <div id="clock">--:--</div>
      <div id="day"><span id="dayText"></span><span id="modeBadge" class="live">LIVE</span></div>
      <div id="liveNote"></div>
      <div id="viewNote"></div>
    </div>
    <div class="controls">
      <select id="daySel" title="Day"><option value="0">Wed</option><option value="1440" selected>Thu</option></select>
      <input type="time" id="timeIn" title="Set the time">
      <button id="prevBtn" title="Left arrow">&larr; Prev step</button>
      <button id="nextBtn" title="Right arrow">Next step &rarr;</button>
      <button id="nowBtn" class="primary" title="N">Now</button>
      <button id="playBtn" title="Space">Play</button>
      <select id="speedSel" title="Speed">
        <option value="1">1x</option><option value="10">10x</option><option value="30">30x</option>
        <option value="60" selected>60x</option><option value="180">180x</option><option value="600">600x</option>
      </select>
      <button id="scaleBtn" title="S">Scale: stretched</button>
      <button id="undoBtn" title="U">Undo done</button>
      <button id="doneListBtn" title="L">Done list</button>
      <button id="fsBtn" title="F">Full screen</button>
      <button id="helpBtn" title="?">?</button>
    </div>
  </header>

  <div class="sliderrow">
    <div id="ticks"></div>
    <input type="range" id="slider" step="1">
    <div class="sliderlabels" id="sliderLabels"></div>
  </div>

  <main>
    <div class="col">
      <section class="card" id="nowCard">
        <h3 id="nowLabel">Now</h3>
        <div id="nowTitle">-</div>
        <div id="nowMeta"></div>
        <div id="nowAlso"></div>
        <div id="nowDetail"></div>
        <div id="timerWrap">
          <div class="timerrow">
            <div class="timerleft">
              <div id="timerLabel">time left on this step</div>
              <div id="timer">0:00</div>
            </div>
            <button id="doneBtn" class="ok">Mark done (D)</button>
          </div>
          <div class="bar"><div id="barFill"></div></div>
        </div>
      </section>
      <section class="card" id="alsoCard"><div class="inner">
        <h3>Also happening / running</h3>
        <div id="alsoList"></div>
      </div></section>
    </div>

    <div class="col">
      <section class="card oven" id="ovenTop"><div class="inner" id="ovenTopIn"></div></section>
      <section class="card oven" id="ovenBottom"><div class="inner" id="ovenBottomIn"></div></section>
      <section class="card" id="burnCard"><div class="inner" id="burnIn"></div></section>
    </div>

    <div class="col">
      <section class="card" id="prepCard"><div class="inner">
        <h3>Prepared and where it is</h3>
        <div id="prepList"></div>
      </div></section>
    </div>
  </main>

  <footer>
    <section class="card" id="nextCard"><div class="inner">
      <h3>Next step</h3>
      <div id="nextTitle">-</div>
      <div id="nextWhen"></div>
      <div class="keys">Press <kbd>?</kbd> for keyboard shortcuts</div>
    </div></section>
    <section class="card" id="upCard"><div class="inner">
      <h3>Coming up after that</h3>
      <div id="upcoming"></div>
    </div></section>
  </footer>
</div>

<div id="updateBar" hidden>A newer version of this page is available. <button id="reloadBtn">Reload</button></div>

<div id="mbar"><button id="mPrev">&larr;</button><button id="mNow" class="primary">Now</button><button id="mDone" class="ok">Done</button><button id="mNext">&rarr;</button></div>

<div id="modal" hidden><div class="box"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" id="modalActions"></div></div></div>

<script>
// ===================== DATA =====================
const APP_NAME = "Chef Dashboard";   // change this to rename the page

const W = (h, m = 0) => h * 60 + m;          // Wednesday Nov 25, minutes from midnight
const T = (h, m = 0) => 1440 + h * 60 + m;   // Thursday Nov 26
const RANGE_START = W(17, 0), RANGE_END = T(20, 0);

// s = start, d = duration in minutes, bg = background (running on its own, not hands-on)
const TASKS = [
  { id: "w1", s: W(17,30), d: 15, t: "Check your supplies", who: "Michael",
    x: "Have in hand: aluminum-free baking powder, Morton salt, vegetable oil, basil, and the roasting pan with the stainless steel wire rack. Make room on one fridge shelf for the roasting pan (it fits once the shelf is cleared)." },
  { id: "w2", s: W(18,0), d: 20, t: "Dry brine the turkey", who: "Michael",
    x: "Pat both breasts dry. Mix 3 tbsp Morton salt + 1 tbsp aluminum-free baking powder. Shower it over ALL surfaces (top, sides, underside, rib cavity) from 6-10 inches up until well coated, not crusted. Skin side up on the wire rack in the roasting pan, UNCOVERED, on one fridge shelf. The same pan and rack are used to roast it. You will not rinse it later." },
  { id: "w3", s: W(20,30), d: 55, t: "Toast the stuffing bread", who: "Michael",
    x: "Toast the country white bread in the toaster (6 slices per round, about 6 minutes with unloading). Cube each batch while the next one toasts. 3 loaves (about 45 slices, 27 cups of cubes) is what the stuffing needs; the 4th loaf is a spare. Bag the cubes and leave them on the counter." },

  { id: "t1", s: T(9,0), d: 20, t: "Dressing, glaze, and chestnuts", who: "Michael",
    x: "Salad dressing: 3/4 cup olive oil, 1/2 cup lemon juice (about 3 lemons), 1 1/2 tsp salt, 1-2 tsp sugar, pepper, shaken in a jar. Ham glaze: 1 cup brown sugar, 1/4 cup Dijon or honey, 2-3 tbsp water or apple juice. Cut an X in each chestnut. Leave all on the counter. At 9:15 set the BOTTOM oven to 375F for the cornbread." },
  { id: "t2", s: T(9,30), d: 20, t: "Bake the cornbread muffins", who: "Michael",
    x: "2 box mixes (per box: 2 eggs, 1/3 cup butter, 1/2 cup milk). Grease 2 muffin tins (12 cups each) with the vegetable shortening, then fill them. Bake in the BOTTOM oven at 375F for 18 minutes. Cool, then cover tightly with foil." },
  { id: "t3", s: T(10,30), d: 30, t: "Chop the stuffing celery and onion", who: "Anthony + an adult",
    x: "6 large celery stalks and 3 medium onions. Keep covered on the counter." },
  { id: "t4", s: T(11,30), d: 70, t: "Peel and chop potatoes and soup vegetables", who: "Carmine, Dominic, Michael",
    x: "Peel and cut 8-9 lb potatoes into 2-inch chunks, in cold salted water. Soup: chop 3 onions, 9 celery stalks, about 1 lb baby carrots (sliced), 3/4 head cabbage (shredded), 6 zucchini; dice 6 potatoes (keep in water)." },
  { id: "t5", s: T(12,50), d: 25, t: "Boil the mashing potatoes", who: "Carmine",
    x: "10 qt pot, salted water, boil 15-20 minutes until fork-tender. Burner 1." },
  { id: "t6", s: T(13,15), d: 15, t: "Mash the potatoes and fill 2 dishes", who: "Carmine",
    x: "Drain and dry in the pot 1-2 min. Warm 4 sticks butter + 2-3 cups milk (microwave). Mash, adding gradually. Spread into the 9x13x1.5 and the 8x8x2.5 Pyrex, dot with butter, cover tightly with foil." },
  { id: "t6b", s: T(13,30), d: 45, t: "Set the tables (after lunch)", who: "Kaia, Issac + kids",
    x: "Set the table and the kids' table, and put out the serving dishes with labels. This waits until after lunch because guests use the tables before then." },
  { id: "t7", s: T(13,30), d: 5, t: "Potatoes into the TOP oven (200F)", who: "Michael",
    x: "Set the top oven to 200F. Put in both covered dishes to hold hot. Set hot glass on a towel, not a cold surface." },
  { id: "t7b", s: T(13,35), d: 120, bg: true, t: "Potatoes holding hot in the top oven", who: "",
    x: "Nothing to do. They come out at 3:35 PM." },
  { id: "t8", s: T(13,45), d: 15, t: "Turkey out of the fridge", who: "Michael",
    x: "Take the pan with both breasts out of the fridge. Do NOT rinse the turkey or add more salt; blot any wet spots. Lift the turkey (on its rack) onto a clean tray, pour out the liquid and loose salt, rinse and dry the pan and rack, then put them back and set the turkey on the rack." },

    try {   // migrate the older done list, if there is one
      const old = JSON.parse(localStorage.getItem("tg26_done") || "[]");
      if (!events.length && old.length) { const t0 = Date.now() - old.length * 1000; events = old.map((id, i) => ({ t: t0 + i, id, type: "done", plan: null })); }
    } catch (e) {}
  } else { document.body.classList.add("viewer"); }
  // one-time: steps that were finished before the dashboard tracked them (applied once, so unmarking sticks)
  const SEED_DONE = ["w1", "w2", "w3"];
  if (!viewer) {
    try {
      const seeded = JSON.parse(localStorage.getItem("tg26_seeded") || "[]");
      const fresh = SEED_DONE.filter(id => !seeded.includes(id));
      if (fresh.length) {
        fresh.forEach(id => { if (!events.some(e => e.id === id)) events.push({ t: Date.now(), id: id, type: "done", plan: null }); });
        localStorage.setItem("tg26_seeded", JSON.stringify(seeded.concat(fresh)));
        localStorage.setItem("tg26_events", JSON.stringify(events));
      }
    } catch (e) {}
  }
  derive();
  const saveDone = () => { derive(); if (!viewer) { try { localStorage.setItem("tg26_events", JSON.stringify(events)); } catch (e) {} } };

  const r0 = realNowMin();
  const st = { sim: r0.min, mode: "live", playing: false, speed: 60, state: r0.state, diff: r0.diff, last: performance.now() };

  document.title = APP_NAME + " - Thanksgiving 2026";
  $("appName").textContent = APP_NAME;
  const slider = $("slider");
  slider.min = 0; slider.max = 1000; slider.step = 1;
  let scaleMode = "stretched";   // the non-linear scale is always the default on load
  useScale(scaleMode);
  function buildLabels() {
    const list = scaleMode === "linear" ? LINEAR_LABELS : SLIDER_LABELS;
    $("sliderLabels").innerHTML = list.map(l => {
      const left = minToPos(l[0]) / 10, tf = l[2] === "c" ? "translateX(-50%)" : l[2] === "r" ? "translateX(-100%)" : "none";
      return '<span style="left:' + left + '%;transform:' + tf + '">' + l[1] + "</span>";
    }).join("");
    $("scaleBtn").textContent = "Scale: " + (scaleMode === "linear" ? "linear" : "stretched");
  }
  function toggleScale() {
    scaleMode = scaleMode === "linear" ? "stretched" : "linear";
    useScale(scaleMode);
    buildTicks(); buildLabels(); render();
  }

  function buildTicks() {
    $("ticks").innerHTML = STARTS.map(s => {
      const left = minToPos(s) / 10;
      return '<i style="left:' + left + '%"></i>';
    }).join("");
  }
  buildTicks();
  buildLabels();

  function setSim(min, keepMode) {
    st.sim = clamp(min, RANGE_START, RANGE_END);
    if (!keepMode) { st.mode = "manual"; st.playing = false; }
    render();
  }
  function goNow() { const r = realNowMin(); st.mode = "live"; st.playing = false; st.state = r.state; st.diff = r.diff; st.sim = r.min; render(); }
  function step(dir) {
    const t = dir > 0 ? nextStart(st.sim) : prevStart(st.sim);
    if (t !== undefined) setSim(t);
  }
  function currentTarget() {
    const snap = snapshot(st.sim, done);
    return snap.primary || snap.upcoming[0] || null;
  }
  function logEvent(id, type) {
    if (viewer) return;
    events.push({ t: Date.now(), id: id, type: type, plan: Math.round(st.sim) });
    saveDone(); render(); refreshModal();
  }
  function toggleDone() {
    const t = currentTarget();
    if (!t || viewer) return;
    logEvent(t.id, done.has(t.id) ? "undo" : "done");
  }
  function undoDone() { if (viewer || !order.length) return; logEvent(order[order.length - 1], "undo"); }
  function unmark(id) { logEvent(id, "undo"); }
  function unmarkAll() { if (viewer) return; order.slice().forEach(id => events.push({ t: Date.now(), id: id, type: "undo", plan: Math.round(st.sim) })); saveDone(); render(); refreshModal(); }

  // publishing: you download progress.json and commit it to the repo yourself; followers open the page with ?view
  function publishProgress() {
    const data = { updated: new Date().toISOString(), by: "Michael", events: events };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
    a.download = "progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    flash("Saved progress.json. Put it in the repo folder, commit it, and push to publish.");
  }
  function loadPublished(quiet) {
    return fetch("progress.json?" + Date.now(), { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("none"); return r.json(); })
      .then(d => {
        published = { updated: d.updated };
        events = viewer ? (d.events || []) : mergeEvents(events, d.events || []);
        saveDone(); render(); refreshModal();
        if (!quiet) flash("Loaded the published progress (" + (d.events || []).length + " events).");
      })
      .catch(() => { if (!quiet) flash("No published progress.json found yet."); });
  }
  function flash(msg) { const n = $("modalNote"); if (n) n.textContent = msg; }

  // popups: keyboard help and the done list (where you can unmark steps)
  let modalMode = null;
  function openModal(mode) { modalMode = mode; $("modal").hidden = false; refreshModal(); }
  function closeModal() { modalMode = null; $("modal").hidden = true; }
  function refreshModal() {
    if (!modalMode) return;
    if (modalMode === "help") {
      $("modalTitle").textContent = "Keyboard shortcuts";
      $("modalBody").innerHTML = "<table>" + [
        ["\u2190 / \u2192", "Previous / next step"], ["\u2191 / \u2193", "Move time 5 minutes (Shift: 30 minutes)"],
        ["D", "Mark the current step done"], ["U", "Undo the last done"], ["L", "Open the done list (unmark any step)"],
        ["N", "Snap to the real time (live)"], ["S", "Switch the slider between stretched and linear time"], ["Space", "Play / pause the simulation"], ["F", "Full screen"], ["?", "This help"], ["Esc", "Close a popup"]
      ].map(r => '<tr><td class="k">' + r[0] + "</td><td>" + r[1] + "</td></tr>").join("") + "</table>";
      $("modalActions").innerHTML = '<button id="mClose">Close</button>';
    } else {
      $("modalTitle").textContent = (viewer ? "Shared progress" : "Steps marked done") + " (" + order.length + " of " + TASKS.filter(t => !t.bg).length + ")";
      const when = ms => new Date(ms).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
      const rows = order.slice().reverse().map(id => TASKS.find(t => t.id === id)).filter(Boolean).map(t =>
        '<tr><td>' + t.t + '</td><td class="k">done ' + when(info[t.id].t) + '</td><td class="k">plan ' + clockStr(t.s) + '</td>' +
        (viewer ? "" : '<td><button data-unmark="' + t.id + '">Unmark</button></td>') + '</tr>').join("");
      $("modalBody").innerHTML = (rows ? "<table>" + rows + "</table>" : "<div class='empty'>Nothing is marked done.</div>") + '<div class="empty" id="modalNote"></div>';
      $("modalActions").innerHTML = (viewer ? '<button id="mLoad">Refresh</button>' :
        '<button id="mPub">Publish progress (progress.json)</button><button id="mLoad">Load published</button>' + (order.length ? '<button id="mAll">Unmark all</button>' : "")) + '<button id="mClose">Close</button>';
    }
  }
  $("modal").addEventListener("click", e => {
    if (e.target.id === "modal" || e.target.id === "mClose") closeModal();
    else if (e.target.id === "mAll") unmarkAll();
    else if (e.target.id === "mPub") publishProgress();
    else if (e.target.id === "mLoad") loadPublished(false);
    else if (e.target.dataset && e.target.dataset.unmark) unmark(e.target.dataset.unmark);
  });
  $("mPrev").onclick = () => step(-1);
  $("mNext").onclick = () => step(1);
  $("mNow").onclick = goNow;
  $("mDone").onclick = toggleDone;
  $("scaleBtn").onclick = toggleScale;
  $("undoBtn").onclick = undoDone;
  $("doneListBtn").onclick = () => openModal("done");
  $("helpBtn").onclick = () => openModal("help");

  function rowHTML(t, sim, late) {
    const r = late ? "late " + durStr(sim - t.e) : durStr(t.e - sim);
    const isDone = !late && done.has(t.id);
    return '<div class="row' + (late ? " late" : "") + (isDone ? " donerow" : "") + '"><span class="t">' + (isDone ? "\u2713 " : "") + t.t + '</span><span class="r">' + r + "</span></div>";
  }
  function ovenHTML(name, o, sim) {
    if (o.now) {
      const left = o.now.e - sim;
      return '<div class="top"><span class="name">' + name + '</span><span class="temp">' + o.now.temp + '</span></div>' +
        '<div class="what">' + o.now.what + '</div>' +
        '<div class="state">' + o.now.state + " &middot; changes in " + durStr(left) + '</div>';
    }
    const nx = o.next;
    return '<div class="top"><span class="name">' + name + '</span><span class="temp">OFF</span></div>' +
      '<div class="what" style="color:var(--mute)">Empty</div>' +
      '<div class="state">' + (nx ? "Next: " + nx.what + " at " + clockStr(nx.s) : "Nothing more planned") + "</div>";
  }

  const fitKeys = {};
  function fitCards() {
    ["alsoCard", "ovenBottom", "ovenTop", "burnCard", "prepCard", "nextCard", "upCard"].forEach(id => {
      const card = $(id), inner = card.querySelector(".inner");
      if (!inner) return;
      const sig = inner.children.length + "|" + inner.querySelectorAll(".row,.item,.bc,.brow,.what").length + "|" +
        inner.textContent.replace(/[0-9:]/g, "").length + "|" + innerWidth + "x" + innerHeight;
      if (fitKeys[id] === sig) return;
      fitKeys[id] = sig;
      const tryFit = () => {
        let z = 1;
        inner.style.zoom = 1;
        while (z > 0.35 && card.scrollHeight > card.clientHeight + 1) { z -= 0.04; inner.style.zoom = z.toFixed(2); }
        return z;
      };
      const list = id === "prepCard" ? $("prepList") : null;
      if (list) list.classList.remove("two");
      let z = tryFit();
      if (list && z < 0.72) { list.classList.add("two"); z = tryFit(); }
    });
  }
  let lastFitKey = "";
  function fitNow() {
    const root = document.documentElement, card = $("nowCard"), det = $("nowDetail");
    let f = 1;
    root.style.setProperty("--fit", f);
    for (let i = 0; i < 24 && f > 0.4; i++) {
      if (det.scrollHeight <= det.clientHeight + 1 && card.scrollHeight <= card.clientHeight + 1) break;
      f -= 0.04;
      root.style.setProperty("--fit", f.toFixed(2));
    }
  }
  window.addEventListener("resize", () => { lastFitKey = ""; Object.keys(fitKeys).forEach(k => delete fitKeys[k]); render(); });

  function render() {
    const sim = st.sim;
    const snap = snapshot(sim, done);

    if (st.mode === "live") {   // live: show the actual clock time and date, even before or after the plan
      const nowD = new Date();
      $("clock").textContent = nowD.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" });
      $("dayText").textContent = nowD.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
    } else {
      $("clock").textContent = clockStr(sim, true);
      $("dayText").textContent = dayStr(sim) + ", Nov " + (sim >= 1440 ? 26 : 25);
    }
    const badge = $("modeBadge");
    if (st.mode === "live") { badge.className = "live"; badge.id = "modeBadge"; badge.textContent = "LIVE"; }
    else { badge.className = "sim"; badge.id = "modeBadge"; badge.textContent = st.playing ? "SIM " + st.speed + "x" : "SIM (paused)"; }
    const live = st.mode === "live";
    const sh = (live && st.state === "before") ? st.diff : 0;   // extra time until the plan starts
    $("liveNote").textContent = !live ? "" :
      st.state === "before" ? "Plan starts in " + longDur(st.diff) :
      st.state === "after" ? "Finished " + longDur(st.diff) + " ago" : "";
    $("viewNote").textContent = !viewer ? "" : published ?
      "View only: progress published " + new Date(published.updated).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + " (checks every minute)" + (lastPlanUpdate ? "; plan updated " + new Date(lastPlanUpdate).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "") :
      "View only: no published progress yet";
    $("playBtn").textContent = st.playing ? "Pause" : "Play";
    slider.value = Math.round(minToPos(sim));
    $("daySel").value = sim >= 1440 ? "1440" : "0";
    const m = ((sim % 1440) + 1440) % 1440;
    if (document.activeElement !== $("timeIn")) $("timeIn").value = pad(Math.floor(m / 60)) + ":" + pad(Math.floor(m % 60));

    // tick marks colored by done
    const marks = $("ticks").children;
    STARTS.forEach((s, i) => {
      const ids = TASKS.filter(t => !t.bg && t.s === s);
      if (marks[i]) marks[i].className = ids.every(t => done.has(t.id)) ? "done" : "";
    });

    // NOW card
    const p = snap.primary;
    if (p) {
      const pDone = done.has(p.id);
      $("nowLabel").textContent = pDone ? "Done" : (p.bg ? "Now (just waiting)" : "Doing now");
      $("nowTitle").textContent = (pDone ? "\u2713 " : "") + p.t;
      $("nowMeta").textContent = (p.who ? p.who + " · " : "") + clockStr(p.s) + " to " + clockStr(p.e) +
        (pDone && info[p.id] ? " · done at " + new Date(info[p.id].t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "");
      $("nowDetail").textContent = p.x;
      const together = snap.also.filter(t => !t.bg);   // other hands-on steps happening at the same time
      $("nowAlso").textContent = together.length ? "Also now: " + together.map(t => (done.has(t.id) ? "\u2713 " : "") + t.t + " (" + durStr(t.e - sim) + ")").join("  |  ") : "";
      const left = p.e - sim, frac = clamp((sim - p.s) / (p.e - p.s), 0, 1);
      $("timer").textContent = fixedDur(left);
      $("timer").className = "";
      $("timerLabel").textContent = "time left on this step";
      $("barFill").style.width = (frac * 100) + "%";
      $("doneBtn").textContent = pDone ? "Done. Undo (D)" : "Mark done (D)";
      $("doneBtn").disabled = false;
    } else {
      const nx = snap.upcoming[0];
      $("nowLabel").textContent = "Doing now";
      $("nowTitle").textContent = nx ? "Nothing right now" : "All done. Enjoy!";
      $("nowMeta").textContent = nx ? "Next at " + clockStr(nx.s) : "";
      $("nowDetail").textContent = nx ? "You are caught up. The next step is below." : "Every step is finished.";
      $("nowAlso").textContent = "";
      $("timer").textContent = nx ? fixedDur(nx.s - sim + sh) : "0:00";
      $("timer").className = "";
      $("timerLabel").textContent = nx ? "until the next step starts" : "";
      $("barFill").style.width = "0%";
      $("doneBtn").textContent = nx ? "Mark next step done (D)" : "Mark done (D)";
      $("doneBtn").disabled = !nx;
    }

    // also / late
    let also = "";
    const showLate = st.mode === "live";   // in simulation, steps you skipped past are not flagged
    if (showLate) snap.late.forEach(t => { also += rowHTML(t, sim, true); });
    snap.also.forEach(t => { also += rowHTML(t, sim, false); });
    if (showLate && snap.skipped) also += '<div class="empty">' + snap.skipped + " earlier step(s) not marked done</div>";
    $("alsoList").innerHTML = also || '<div class="empty">Nothing else running</div>';

    // fit the Doing Now content inside its box
    const fitKey = $("nowTitle").textContent + "|" + $("nowDetail").textContent.length + "|" + innerWidth + "x" + innerHeight;
    if (fitKey !== lastFitKey) { lastFitKey = fitKey; fitNow(); }

    // ovens
    $("ovenBottom").className = "card oven " + (snap.ovenBottom.now ? "on" : "off");
    $("ovenTop").className = "card oven " + (snap.ovenTop.now ? "on" : "off");
    $("ovenBottomIn").innerHTML = ovenHTML("Bottom oven", snap.ovenBottom, sim);
    $("ovenTopIn").innerHTML = ovenHTML("Top oven", snap.ovenTop, sim);

    // burners: numbered like the stove (1-3 small in back, 4-5 large in front)
    const NUM = { BL: 1, BM: 2, BR: 3, FL: 4, FR: 5 };
    const COL = { 1: "#ff6b6b", 2: "#ffb020", 3: "#3ecf8e", 4: "#5aa9ff", 5: "#c084fc" };
    const bySlot = {};
    snap.burners.forEach(bn => { bySlot[bn.slot] = bn; });
    const circ = (slot, size) => {
      const n = NUM[slot], on = !!bySlot[slot];
      return '<div class="bc ' + size + (on ? " on" : "") + '"' + (on ? ' style="background:' + COL[n] + '"' : "") + ">" + n + "</div>";
    };
    const list = snap.burners.slice().sort((x, y) => NUM[x.slot] - NUM[y.slot]).map(bn => {
      const n = NUM[bn.slot];
      return '<div class="brow"><i style="background:' + COL[n] + '">' + n + '</i><span class="what"><b>' + bn.short + "</b> <small>" + bn.pot + '</small></span><span class="tm">' + durStr(bn.e - sim) + "</span></div>";
    }).join("");
    $("burnIn").innerHTML = "<h3>Burners (" + snap.burners.length + " of 5 on)</h3>" +
      '<div class="burnwrap"><div class="stove"><div class="rowb">' + circ("BL", "small") + circ("BM", "small") + circ("BR", "small") + "</div>" +
      '<div class="rowb">' + circ("FL", "large") + circ("FR", "large") + '</div></div><div class="blist">' +
      (list || '<div class="empty">All burners off</div>') + "</div></div>";

    // prepared
    $("prepList").innerHTML = snap.prepared.length ?
      snap.prepared.map(i => '<div class="item"><span>' + i.n + '</span><span class="chip ' + locCat(i.loc) + '">' + i.loc + "</span></div>").join("") :
      '<div class="empty">Nothing prepared yet</div>';

    // next
    const nx = snap.upcoming[0];
    if (nx) {
      $("nextTitle").textContent = nx.t;
      $("nextWhen").textContent = "starts at " + clockStr(nx.s) + " (in " + longDur(nx.s - sim + sh) + ")" + (nx.who ? " · " + nx.who : "");
    } else { $("nextTitle").textContent = "Nothing left"; $("nextWhen").textContent = ""; }
    $("upcoming").innerHTML = snap.upcoming.slice(1, 4).map(t =>
      '<div class="row"><span class="t">' + clockStr(t.s) + " &nbsp; " + t.t + '</span><span class="r">in ' + longDur(t.s - sim + sh) + "</span></div>").join("") || '<div class="empty">-</div>';

    // make every box fit (shrink its content if needed); runs last, after all content is updated
    fitCards();
  }

  // time advance
  function tick() {
    const now = performance.now(), dt = (now - st.last) / 60000;
    st.last = now;
    if (st.mode === "live") { const r = realNowMin(); st.sim = r.min; st.state = r.state; st.diff = r.diff; }
    else if (st.playing) { st.sim = clamp(st.sim + dt * st.speed, RANGE_START, RANGE_END); if (st.sim >= RANGE_END) st.playing = false; }
    render();
  }
  setInterval(tick, 250);

  // controls
  slider.addEventListener("input", () => { setSim(posToMin(+slider.value)); slider.blur(); });
  $("nowBtn").onclick = goNow;
  $("prevBtn").onclick = () => step(-1);
  $("nextBtn").onclick = () => step(1);
  $("doneBtn").onclick = toggleDone;
  $("playBtn").onclick = () => { if (st.mode === "live") st.mode = "manual"; st.playing = !st.playing; st.last = performance.now(); render(); };
  $("speedSel").onchange = e => { st.speed = +e.target.value; $("speedSel").blur(); render(); };
  $("fsBtn").onclick = toggleFS;
  const setFromInputs = () => {
    const [h, m] = ($("timeIn").value || "00:00").split(":").map(Number);
    setSim(+$("daySel").value + h * 60 + m);
  };
  $("daySel").onchange = () => { setFromInputs(); $("daySel").blur(); };
  $("timeIn").onchange = () => { setFromInputs(); $("timeIn").blur(); };
  function toggleFS() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  }

  document.addEventListener("keydown", e => {
    if (e.target && (e.target.id === "timeIn")) return;
    const k = e.key;
    if (modalMode) { if (k === "Escape" || k === "?") { e.preventDefault(); closeModal(); } return; }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (k === "ArrowRight") { e.preventDefault(); step(1); }
    else if (k === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (k === "ArrowUp") { e.preventDefault(); setSim(st.sim + (e.shiftKey ? 30 : 5)); }
    else if (k === "ArrowDown") { e.preventDefault(); setSim(st.sim - (e.shiftKey ? 30 : 5)); }
    else if (k === "d" || k === "D") { e.preventDefault(); toggleDone(); }
    else if (k === "s" || k === "S") { e.preventDefault(); toggleScale(); }
    else if (k === "u" || k === "U") { e.preventDefault(); undoDone(); }
    else if (k === "l" || k === "L") { e.preventDefault(); openModal("done"); }
    else if (k === "?") { e.preventDefault(); openModal("help"); }
    else if (k === "n" || k === "N") { e.preventDefault(); goNow(); }
    else if (k === "f" || k === "F") { e.preventDefault(); toggleFS(); }
    else if (k === " ") { e.preventDefault(); $("playBtn").click(); }
  }, true);

  render();
  if (viewer) { loadPublished(true); setInterval(() => loadPublished(true), 60000); }

  // pick up changes after you push, without a full reload when only the plan data changed.
  // Plan data (steps, ovens, burners, items) is swapped in place; changes to the page code or layout need a reload.
  if (/^https?:/.test(location.protocol)) {
    const hashText = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h; };
    const parts = t => {
      const a = t.indexOf("// ===================== DATA"), b = t.indexOf("// ===================== CORE LOGIC");
      return a >= 0 && b > a ? { data: t.slice(a, b), rest: t.slice(0, a) + t.slice(b) } : { data: "", rest: t };
    };
    const swap = (cur, nw) => { cur.length = 0; nw.forEach(x => cur.push(x)); };
    function applyData(nd) {
      swap(TASKS, nd.TASKS); swap(OVEN_BOTTOM, nd.OVEN_BOTTOM); swap(OVEN_TOP, nd.OVEN_TOP); swap(BURNERS, nd.BURNERS); swap(ITEMS, nd.ITEMS);
      swap(STARTS, Array.from(new Set(TASKS.filter(t => !t.bg).map(t => t.s))).sort((x, y) => x - y));
      lastPlanUpdate = Date.now();
      buildTicks(); buildLabels(); render();
    }
    let base = null;
    const check = () => fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => {
      const p = parts(t), hd = hashText(p.data), hr = hashText(p.rest);
      if (!base) { base = { hd: hd, hr: hr }; return; }
      if (hr !== base.hr) { if (viewer) location.reload(); else $("updateBar").hidden = false; return; }   // page code changed
      if (hd !== base.hd) {
        try {
          applyData(new Function(p.data + "; return { TASKS: TASKS, OVEN_BOTTOM: OVEN_BOTTOM, OVEN_TOP: OVEN_TOP, BURNERS: BURNERS, ITEMS: ITEMS };")());
          base.hd = hd;
        } catch (e) { if (viewer) location.reload(); else $("updateBar").hidden = false; }
      }
    }).catch(() => {});
    $("reloadBtn").onclick = () => location.reload();
    check(); setInterval(check, viewer ? 60000 : 120000);
  }
}
